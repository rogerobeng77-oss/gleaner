[project]
name = "gleaner"
version = "0.1.0"
description = "An autonomous food-rescue coordinator built with Strands Agents"
requires-python = ">=3.12"
dependencies = [
    "strands-agents==1.54.0",
    "strands-agents-tools>=0.8.7",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "anyio>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gleaner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: hits Amazon Bedrock; requires AWS credentials"]
